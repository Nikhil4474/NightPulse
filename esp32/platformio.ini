; NightPulse on ESP32-S3.  Waveshare ESP32-S3-LCD-1.47:  pio run -e s3_lcd147 -t upload   then   pio device monitor
[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
board = esp32-s3-devkitc-1
board_build.filesystem = littlefs
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_flags = -O2 -DARDUINO_USB_CDC_ON_BOOT=1 -DBOARD_HAS_PSRAM
lib_deps = moononournation/GFX Library for Arduino@^1.5.0

[env:s3_lcd147]
build_flags = ${env.build_flags} -DUSE_LCD=1

[env:s3_n16r8]
build_flags = ${env.build_flags} -DUSE_LCD=0
